[project]
name = "cf-tams"
version = "0.1.0"
description = "TAMS 8.2 on Cloudflare Workers, Durable Objects and R2"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.12.5",
  "mediatimestamp==5.2.0",
]

[dependency-groups]
dev = ["botocore==1.43.63", "workers-py==1.17.4", "workers-runtime-sdk==1.9.0", "pytest==9.1.0", "httpx==0.28.1", "ruff==0.15.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["tams_conformance: shared BBC TAMS contract checks", "tams_semantics: shared API semantics", "worker: real Workers runtime checks", "tamoss_security: API security cases", "tamoss_extension: behaviour beyond the core BBC contract"]

[tool.ruff]
target-version = "py314"
